# A11: INFO no pipeline; WARN em Parquet/Hadoop (DEBUG gera logs de centenas de GB).
log4j.rootLogger=INFO, console
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{HH:mm:ss.SSS} [%t] %-5p %c - %m%n
log4j.logger.org.apache.parquet=ERROR
log4j.logger.org.apache.parquet.io=ERROR
log4j.logger.org.apache.parquet.hadoop=ERROR
log4j.logger.org.apache.parquet.column=ERROR
log4j.logger.org.apache.parquet.bytes=ERROR
log4j.logger.org.apache.parquet.crypto=ERROR
