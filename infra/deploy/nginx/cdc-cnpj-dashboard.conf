# Site Nginx — copiado por infra/deploy/setup-dashboard.sh
# Variáveis substituídas no deploy: __SERVER_NAME__, __WEB_ROOT__, __AUTH_BLOCK__

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Limite de corpo (só GET no dashboard; defesa em profundidade)
    client_max_body_size 1m;

    root __WEB_ROOT__;
    index index.html;

    include /etc/nginx/cdc-cnpj-dashboard-auth.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

